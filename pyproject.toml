[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-chile-cities"
version = "2.0.0"
description = "Una librería Django para manejar regiones, provincias y ciudades en Chile."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Daniel Ojeda", email = "danielo@newdev.cl" },
]
keywords = ["django", "chile", "cities", "regions", "provinces", "comunas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "django>=4.2",
]

[project.optional-dependencies]
dev = [
    "build",
    "coverage",
    "factory-boy",
    "pre-commit",
    "pytest",
    "pytest-django",
    "ruff",
    "tox",
    "twine",
]
factories = [
    "factory-boy",
]

[project.urls]
Homepage = "https://github.com/NewDevCoop/django-chile-cities"
Changelog = "https://github.com/NewDevCoop/django-chile-cities/blob/main/CHANGELOG.md"
Issues = "https://github.com/NewDevCoop/django-chile-cities/issues"

[tool.setuptools.packages.find]
include = ["django_chile_cities*"]

[tool.setuptools.package-data]
django_chile_cities = ["fixtures/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]
# RUF012: Django Meta/Admin/Migration classes use mutable class attributes by design
ignore = ["RUF012"]
